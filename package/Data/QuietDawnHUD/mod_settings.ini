[Mod]
Id = oOCamilleOo_QuietDawnHUD
Name = Quiet Dawn - Configurable HUD
Author = oOCamilleOo
Version = 0.0.0
AuthorURL = https://www.nexusmods.com/users/933214
Description = Change settings here. Apply, then load a save.

[Setting.enabled]
Id = enabled
Label = Enabled
Group = General
Description = Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enabled

[Setting.hideEnemyHealthBars]
Id = hideEnemyHealthBars
Label = Hide enemy health bars
Group = Enemies
Description = Hide ordinary enemy and boss health bars, end caps and boss health-phase indicators. Turn Off to restore their normal game behavior, independently of names and difficulty icons. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = hideEnemyHealthBars

[Setting.hideEnemyNames]
Id = hideEnemyNames
Label = Hide enemy names
Group = Enemies
Description = Hide enemy name labels, including boss names. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = hideEnemyNames

[Setting.hideEnemyDifficultyIcons]
Id = hideEnemyDifficultyIcons
Label = Hide enemy difficulty icons
Group = Enemies
Description = Hide enemy and boss difficulty indicators. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = hideEnemyDifficultyIcons

[Setting.showCounterattackDirection]
Id = showCounterattackDirection
Label = Show counterattack direction
Group = Combat cues
Description = Show the attack direction during a counter opening, including after a perfect parry. Independent of the game's Directional Indicator option. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = showCounterattackDirection

[Setting.showUnblockableWarning]
Id = showUnblockableWarning
Label = Show unblockable warning
Group = Combat cues
Description = Show the skull warning when an enemy begins an unblockable attack. Independent of the game's Directional Indicator option. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = showUnblockableWarning

[Setting.showDirectionalParry]
Id = showDirectionalParry
Label = Show directional parry cues
Group = Combat cues
Description = Show the incoming attack direction and highlight the arrow during the parry window. Independent of the game's Directional Indicator option. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = showDirectionalParry

[Setting.showLockIcon]
Id = showLockIcon
Label = Show lock icon
Group = Combat cues
Description = Show a padlock on your locked target between combat cues. The dot is always hidden; directions hide the center icon. Independent of the game's Directional Indicator option. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = showLockIcon

[Setting.combatCueSize]
Id = combatCueSize
Label = Combat cue size
Group = Combat cues
Description = Common size for counterattack directions, parry cues, unblockable warnings and the lock icon. 100% uses the original size. Range: 10% to 200% in 10% steps. Apply, then load a save.
Type = slider
Minimum = 10
Maximum = 200
Step = 10
Decimals = 0
Default = 100
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = combatCueSize
Suffix = %

[Category.Combat cues]
VisibleWhen = enabled
VisibleValues = 1

[Setting.healthThreshold]
Id = healthThreshold
Label = Keep health visible below
Group = Vitals
Description = Keep the health/stamina display visible while human health or vampire blood is below this percentage. Default: 50%. 0% disables the low-health trigger; damage and stamina alerts still work. Adjusts in 5 percentage-point steps. Apply, then load a save.
Type = percent
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Default = 50
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = healthThreshold
Suffix = %

[Setting.staminaThreshold]
Id = staminaThreshold
Label = Keep stamina visible below
Group = Vitals
Description = Keep the health/stamina display visible while stamina is below this percentage. Default: 20%. At 0%, stamina use can still reveal it for the stamina hold duration. Adjusts in 5 percentage-point steps. Apply, then load a save.
Type = percent
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Default = 20
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = staminaThreshold
Suffix = %

[Setting.healthHoldSeconds]
Id = healthHoldSeconds
Label = Health / blood hold duration
Group = Vitals
Description = Show health/blood after damage, gains of at least 1% of the bar, or reaching full after a deficit of at least 0.2%. Smaller regeneration does not extend the timer. Low-resource thresholds remain independent. Default: 4 seconds. 0 disables timed reveals. Apply, then load a save.
Type = slider
Minimum = 0
Maximum = 10
Step = 0.5
Decimals = 1
Default = 4
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = healthHoldSeconds
Suffix = s

[Setting.staminaHoldSeconds]
Id = staminaHoldSeconds
Label = Stamina hold duration
Group = Vitals
Description = How long health and stamina stay visible after stamina use. 0 seconds disables the timed reveal; low stamina remains visible. Range: 0 to 10 seconds in 0.5-second steps. Apply, then load a save.
Type = slider
Minimum = 0
Maximum = 10
Step = 0.5
Decimals = 1
Default = 1.5
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = staminaHoldSeconds
Suffix = s

[Setting.manualPeekSeconds]
Id = manualPeekSeconds
Label = Show HUD duration
Group = Vitals
Description = How long the HUD stays visible after the hold action activates; this is not how long you hold the button. 0 seconds disables HUD peek. Range: 0 to 10 seconds in 0.5-second steps. Apply, then load a save.
Type = slider
Minimum = 0
Maximum = 10
Step = 0.5
Decimals = 1
Default = 3
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = manualPeekSeconds
VisibleWhen = manualPeek
VisibleValues = 1
Suffix = s

[Setting.manualPeek]
Id = manualPeek
Label = Show HUD on hold
Group = Vitals
Description = Uses the game's Toggle Controls Legend action. Hold Menu (Xbox), Options (PlayStation), or L (keyboard) by default. Follows remaps: Toggle Controls Legend in Controller Tweaks and Remap, or the game's keyboard bindings. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = manualPeek

[Setting.hideSprintPrompt]
Id = hideSprintPrompt
Label = Hide sprint/haste prompt
Group = HUD visibility
Description = Hide the Sprint and Haste button prompts while running. Other action prompts retain game behavior. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = hideSprintPrompt

