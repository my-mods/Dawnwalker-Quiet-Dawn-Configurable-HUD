Group = HUD visibility
Description = At 0% opacity, show the time panel at 100% for this many seconds after the last time change. Range: 0 to 10 seconds in 0.5-second steps. Default: 4 seconds. 0 seconds disables automatic time-change reveals. HUD peek still works. Apply, then load a save.
Type = slider
Minimum = 0
Maximum = 10
