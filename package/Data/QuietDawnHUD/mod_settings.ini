[Setting.mode_WBP_ControlsLegend]
Id = mode_WBP_ControlsLegend
Group = Controls: Controls legend
Label = Mode
Description = How the controls legend behaves. Vanilla: leaves its visibility up to the game. Quiet Dawn: hide it and reveal it only when it matters. Fixed Opacity: keep the level set by the slider below. Always Hidden: keep it off completely.
Type = picker
PresetValues = 0|1|2|3
PresetLabels = Vanilla|Quiet Dawn|Fixed Opacity|Always Hidden
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = mode_WBP_ControlsLegend

[Setting.opacity_WBP_ControlsLegend]
Id = opacity_WBP_ControlsLegend
Group = Controls: Controls legend
Label = Opacity
Description = How visible the controls legend stays, from 0% to 100% in 5% steps. Used only in Fixed Opacity mode. Choose Always Hidden in Mode to keep it hidden even during HUD peek and automatic reveals. The game still decides when it would normally be on screen.
Type = percent
VisibleWhen = mode_WBP_ControlsLegend
VisibleValues = 2
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = opacity_WBP_ControlsLegend
Suffix = %

[Setting.scale_WBP_ControlsLegend]
Id = scale_WBP_ControlsLegend
Group = Controls: Controls legend
Label = Size
Description = Size of the controls legend, from 25% to 200% in 5% steps, independent of the mode. 100% is its original size. Edge panels grow inward and centered panels stay centered. Layout spacing never changes though, so large sizes could end up overlapping neighbouring elements.
Type = slider
Minimum = 25
Maximum = 200
Step = 5
Decimals = 0
Default = 100
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = scale_WBP_ControlsLegend
VisibleWhen = mode_WBP_ControlsLegend
VisibleValues = 0|1|2
Suffix = %

