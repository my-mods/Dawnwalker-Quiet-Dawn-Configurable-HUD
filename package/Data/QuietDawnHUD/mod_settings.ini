PresetLabels = Exclude|Include
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = showHUD_WBP_ControlsLegend
VisibleWhen = mode_WBP_ControlsLegend
VisibleValues = 1

