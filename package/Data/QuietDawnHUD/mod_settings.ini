; mod_settings.ini
[Mod]
Id = oOCamilleOo_QuietDawnHUD
Name = Quiet Dawn - Configurable HUD
Author = oOCamilleOo
Version = 1.2.3
AuthorURL = https://www.nexusmods.com/users/933214
ModURL = https://www.nexusmods.com/thebloodofdawnwalker/mods/452
LogoFile = assets/Logo_QuietDawn.png
Description = Keep the world in view, with health and stamina returning when needed. Choose Vanilla, Quiet Dawn, Fixed Opacity or Always Hidden for each player panel, and toggle enemy information separately.

[Setting.enabled]
Id = enabled
Group = General
Label = Master Toggle
Description = Master Toggle. Turn the whole mod ON or OFF. OFF restores the game's own HUD behaviour and hides every setting below.
Type = toggle
PresetValues = 0|1
PresetLabels = OFF|ON
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enabled

[Setting.fadeTransitions]
Id = fadeTransitions
Group = General
Label = Fade elements in and out
Description = Let hidden elements fade out and returning ones fade in, instead of appearing and vanishing instantly. Affects only the elements this mod controls.
Type = toggle
PresetValues = 0|1
PresetLabels = Disabled|Enabled
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = fadeTransitions
VisibleWhen = enabled
VisibleValues = 1

[Setting.fadeInSeconds]
Id = fadeInSeconds
Group = General
Label = Fade in duration
Description = How long an element takes to become fully visible. Shorter feels more responsive; zero appears instantly.
Type = slider
Minimum = 0
Maximum = 2
Step = 0.05
Decimals = 2
Default = 0.35
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = fadeInSeconds
Suffix = s
VisibleWhen = fadeTransitions
VisibleValues = 1

[Setting.fadeOutSeconds]
Id = fadeOutSeconds
Group = General
Label = Fade out duration
Description = How long an element takes to disappear. Usually set a little longer than the fade in, so elements leave gently rather than snapping away.
Type = slider
Minimum = 0
Maximum = 2
Step = 0.05
Decimals = 2
Default = 1.30
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = fadeOutSeconds
Suffix = s
VisibleWhen = fadeTransitions
VisibleValues = 1

[Setting.hidePlayerEffectIcons]
Id = hidePlayerEffectIcons
Group = Player status: Active buffs
Label = Player Effect Icons
Description = Show or Hide player Buff/Debuff icons aswell as their timers, including during Show HUD. This setting overrides the Active buffs mode and Opacity settings below while On.
Type = toggle
PresetValues = 0|1
PresetLabels = Show|Hide
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = hidePlayerEffectIcons

[Setting.mode_WBP_BuffContainer]
Id = mode_WBP_BuffContainer
Group = Player status: Active buffs
Label = Mode
Description = How the active buff and debuff icons and their timers behave. Vanilla leaves their visibility to the game. Quiet Dawn hides them and reveals them only when it matters. Fixed Opacity holds the level set by the slider below. Always Hidden keeps it off completely.
Type = picker
PresetValues = 0|1|2|3
PresetLabels = Vanilla|Quiet Dawn|Fixed Opacity|Always Hidden
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = mode_WBP_BuffContainer

[Setting.opacity_WBP_BuffContainer]
Id = opacity_WBP_BuffContainer
Group = Player status: Active buffs
Label = Opacity
Description = How visible the active buff and debuff icons and their timers stay, from 0% to 100% in 5% steps. Used only in Fixed Opacity mode. Choose Always Hidden in Mode to keep them hidden even during HUD peek and automatic reveals. The game still decides when they would normally be on screen.
Type = percent
VisibleWhen = mode_WBP_BuffContainer
VisibleValues = 2
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = opacity_WBP_BuffContainer
Suffix = %

[Setting.scale_WBP_BuffContainer]
Id = scale_WBP_BuffContainer
Group = Player status: Active buffs
Label = Size
Description = Size of the active buff and debuff icons and their timers, from 25% to 200% in 5% steps, independent of the mode. 100% is their original size. Edge panels grow inward and centered panels stay centered. Layout spacing never changes though, so large sizes could end up overlapping neighbouring elements.
Type = slider
Minimum = 25
Maximum = 200
Step = 5
Decimals = 0
Default = 100
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = scale_WBP_BuffContainer
VisibleWhen = mode_WBP_BuffContainer
VisibleValues = 0|1|2
Suffix = %

[Setting.showHUD_WBP_BuffContainer]
Id = showHUD_WBP_BuffContainer
Group = Player status: Active buffs
Label = HUD Peek Behaviour
Description = Whether this Quiet Dawn element is included when Show HUD is triggered. Exclude keeps it under its own Quiet Dawn rule during HUD Peek.
Type = toggle
PresetValues = 0|1
PresetLabels = Exclude|Include
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = showHUD_WBP_BuffContainer
VisibleWhen = mode_WBP_BuffContainer
VisibleValues = 1

[Setting.fixedPeek_WBP_BuffContainer]
Id = fixedPeek_WBP_BuffContainer
Group = Player status: Active buffs
Label = HUD Peek Behaviour
Description = Whether HUD Peek keeps this element at its chosen Fixed Opacity or raises it to full opacity for the peek.
Type = toggle
PresetValues = 0|1
PresetLabels = Don't change|Raise opacity
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = fixedPeek_WBP_BuffContainer
VisibleWhen = mode_WBP_BuffContainer
VisibleValues = 2

[Category.Player status: Active buffs]
VisibleWhen = enabled
VisibleValues = 1

