[Mod]
Id = oOCamilleOo_QuietDawnHUD
Name = Quiet Dawn - Configurable HUD
Author = oOCamilleOo
Version = 0.0.0
AuthorURL = https://www.nexusmods.com/users/933214
Description = Change settings here. Apply, then load a save.

[Setting.enabled]
Id = enabled
Label = Enabled
Group = General
Description = Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enabled

[Setting.opacity_WBP_BuffContainer]
Id = opacity_WBP_BuffContainer
Label = Active buffs opacity
Group = Player status / Active buffs
Description = 0% = managed by Quiet Dawn; values above 0% keep this panel shown at the selected opacity; 100% = fully opaque. HUD peek temporarily shows it at 100%. Adjusts in 5 percentage-point steps. Apply, then load a save.
Type = percent
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = opacity_WBP_BuffContainer
Suffix = %

[Setting.scale_WBP_BuffContainer]
Id = scale_WBP_BuffContainer
Label = Active buffs size
Group = Player status / Active buffs
Description = Scale this panel from 25% to 200% in 5% steps. 100% keeps its original size. Edge panels grow inward; centered panels remain centered. Layout spacing stays fixed, so large sizes may overlap nearby elements. Apply, then load a save.
Type = slider
Minimum = 25
Maximum = 200
Step = 5
Decimals = 0
Default = 100
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = scale_WBP_BuffContainer
Suffix = %

[Category.Player status / Active buffs]
VisibleWhen = enabled
VisibleValues = 1

