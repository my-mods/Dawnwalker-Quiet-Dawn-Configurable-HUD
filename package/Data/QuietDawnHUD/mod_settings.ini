[Setting.manualPeek]
Id = manualPeek
Group = Controls: HUD peek
Label = Show HUD trigger
Description = Which action reveals the hidden HUD for a period of time. Useful for quickly checking something, say double checking your quickslots, or reminding your of your current quest objective. Controls Legend: Holding the Controls Legend shortcut triggers the reveal. Focus Mode: Keeps the panels visible while in Focus Mode, and hides them when Focus ends after your configured delay.
Type = picker
PresetValues = 0|1|2
PresetLabels = Off|Controls Legend|Focus Mode
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = manualPeek

[Setting.manualPeekSeconds]
Id = manualPeekSeconds
Group = Controls: HUD peek
Label = Show HUD duration
Description = How long the HUD stays visible after a peek before hiding again.
Type = slider
Minimum = 0
Maximum = 10
Step = 0.5
Decimals = 1
Default = 3
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = manualPeekSeconds
VisibleWhen = manualPeek
VisibleValues = 1|2
Suffix = s

[Category.Controls: HUD peek]
VisibleWhen = enabled
VisibleValues = 1

[Setting.logLevel]
Id = logLevel
Group = Diagnostics
Label = Logging
Description = How much this mod writes to UE4SS.log and the console. Each level also includes the ones above it. Off: Writes nothing. Error: Reports only what the mod gave up on. Warning: adds the logs of features that could not start while the rest kept working. Info: Adds notable moments during play. Debug: Adds detailed event tracing and timing summaries. Defaults to Warning.
Type = picker
PresetValues = 0|1|2|3|4
PresetLabels = Off|Error|Warning|Info|Debug
Default = 2
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = logLevel
